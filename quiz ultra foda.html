<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>v∅ // TERMINAL_VELOCITY</title>
    <style>
        body, html { margin: 0; padding: 0; background: #000; color: #0f0; font-family: monospace; overflow: hidden; height: 100vh; }
        canvas { position: absolute; top: 0; left: 0; z-index: 1; mix-blend-mode: screen; }
        #core { position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: rgba(0,0,0,0.8); backdrop-filter: blur(20px); }
        .glitch { font-size: 8vw; font-weight: bold; text-transform: uppercase; animation: shake 0.1s infinite; letter-spacing: -10px; }
        @keyframes shake { 0% { transform: translate(2px, 2px); } 50% { transform: translate(-2px, -2px); } 100% { transform: translate(2px, -2px); } }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; width: 90vw; }
        .node { border: 2px solid #0f0; padding: 20px; text-align: center; font-size: 1.5rem; cursor: none; transition: 0.1s; }
        .node:hover { background: #0f0; color: #000; box-shadow: 0 0 100px #0f0; }
        #timer { position: fixed; bottom: 10px; right: 10px; font-size: 0.8rem; }
    </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="core">
    <div class="glitch" id="q">RECURSION_ERROR</div>
    <div class="grid" id="g"></div>
</div>
<div id="timer">ENTROPY_LEVEL: CRITICAL</div>

<script>
    const canv = document.getElementById('c');
    const ctx = canv.getContext('2d');
    let w, h;
    const res = () => { w = canv.width = window.innerWidth; h = canv.height = window.innerHeight; };
    window.addEventListener('resize', res); res();

    // Motor de Destruição (Física de Fragmentos)
    let frags = Array(1000).fill().map(() => ({ x: w/2, y: h/2, vx: Math.random()*20-10, vy: Math.random()*20-10, s: Math.random()*5 }));
    function loop() {
        ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.fillRect(0,0,w,h);
        frags.forEach(f => {
            f.x += f.vx; f.y += f.vy;
            if(f.x < 0 || f.x > w) f.vx *= -1;
            if(f.y < 0 || f.y > h) f.vy *= -1;
            ctx.fillStyle = '#0f0'; ctx.fillRect(f.x, f.y, f.s, f.s);
        });
        requestAnimationFrame(loop);
    }
    loop();

    // Lógica de Saturação
    const data = [
        {q: "QUAL O NOME DO MUNDO DE ONE PIECE?", a: ["BLUE SEA", "GRAND LINE", "RED LINE", "TERRA"], c: 0},
        {q: "QUEM É O MAIS FORTE?", a: ["SAITAMA", "GOKU", "MADARA", "VOCÊ"], c: 3},
        {q: "O CÓDIGO VAI PARAR?", a: ["SIM", "NÃO", "TALVEZ", "vINF"], c: 1}
    ];

    let p = 0;
    const engine = () => {
        if(p >= data.length) { document.body.innerHTML = "<div style='color:#0f0;font-size:10vw;display:flex;justify-content:center;align-items:center;height:100vh;'>SYSTEM_HALTED</div>"; return; }
        const n = data[p];
        document.getElementById('q').innerText = n.q;
        const grid = document.getElementById('g');
        grid.innerHTML = '';
        n.a.forEach((v, i) => {
            const b = document.createElement('div');
            b.className = 'node'; b.innerText = v;
            b.onclick = () => { p++; engine(); };
            grid.appendChild(b);
        });
    };
    engine();
</script>
</body>
</html>
